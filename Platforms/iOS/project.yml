# Optional: generates Platforms/iOS/GuitarTuner.xcodeproj with XcodeGen.
#
#   brew install xcodegen
#   cd Platforms/iOS && xcodegen generate && open GuitarTuner.xcodeproj
#
# XcodeGen is only a convenience — the README documents the manual setup, which is
# three clicks in Xcode and needs no extra tooling.
name: GuitarTuner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  GuitarTuner:
    path: ../..

targets:
  GuitarTuner:
    type: application
    platform: iOS
    sources:
      - path: GuitarTuneriOSApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.guitartuner
        PRODUCT_NAME: Guitar Tuner
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: GuitarTuner
        product: GuitarTunerUI
      - package: GuitarTuner
        product: GuitarTunerKit
